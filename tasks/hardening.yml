# -------------------------------------------------------
# Image sprawl prevention
# -------------------------------------------------------

- name: Remove dangling/unused Docker images
  community.docker.docker_prune:
    images: true
    images_filters:
      dangling: true
  tags: 
    - docker_hardening
    - docker

- name: Remove all unused Docker images older than defined threshold
  community.docker.docker_prune:
    images: true
    images_filters:
      until: "{{ DOCKER_image_prune_until }}"
  when: DOCKER_image_prune_enabled | bool
  tags: 
    - docker_hardening
    - docker

- name: Remove unused Docker volumes
  community.docker.docker_prune:
    volumes: true
  when: DOCKER_volume_prune_enabled | bool
  tags: 
    - docker_hardening
    - docker

- name: Remove unused Docker networks
  community.docker.docker_prune:
    networks: true
  when: DOCKER_network_prune_enabled | bool
  tags: 
    - docker_hardening
    - docker

- name: Deploy Docker cleanup systemd service
  ansible.builtin.template:
    src: docker-cleanup.service.j2
    dest: /etc/systemd/system/docker-cleanup.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd
  tags: 
    - docker_hardening
    - docker

- name: Deploy Docker cleanup systemd timer
  ansible.builtin.template:
    src: docker-cleanup.timer.j2
    dest: /etc/systemd/system/docker-cleanup.timer
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd
  tags: 
    - docker_hardening
    - docker

- name: Enable and start Docker cleanup timer
  ansible.builtin.systemd:
    name: docker-cleanup.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: 
    - docker_hardening
    - docker
