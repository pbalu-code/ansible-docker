---
# Docker host hardening tasks

- name: Is audit.rules exists
  ansible.builtin.stat:
    path: "{{ DOCKER_auditd_conf_path }}/rules.d/audit.rules"
  register: audit_rules
  tags: 
    - docker_hardening
    - docker

- name: Test auditd immutable mode
  ansible.builtin.lineinfile:
    path: "{{ DOCKER_auditd_conf_path }}/rules.d/audit.rules"
    regexp: '^(\s*)?-e 2(\s*)?$'
    line: '-e 2'
    state: absent
  check_mode: yes
  changed_when: false
  register: immutable_audit
  when: audit_rules.stat.exists
  tags: 
    - docker_hardening
    - docker

- name: Update audit.rules for docker
  ansible.builtin.blockinfile:
    path: "{{ DOCKER_auditd_conf_path }}/rules.d/audit.rules"
    block: |
      # Audit rules for Docker hosts
      # --- Directories (watch entire directory for write/append) ---
      -w /run/containerd -p wa -k docker
      -w /var/lib/docker -p wa -k docker
      -w /etc/docker/ -p wa -k docker
      # --- Service files ---
      -w /etc/systemd/system/docker.service -k docker
      -w /usr/lib/systemd/system/docker.service -k docker
      # --- Socket files ---
      -w /run/containerd/containerd.sock -k docker
      -w /var/run/docker.sock -k docker
      -w /usr/lib/systemd/system/docker.socket -k docker
      # --- Configuration files ---
      -w /etc/default/docker -p wa -k docker
      -w /etc/docker/daemon.json -p wa -k docker
      -w /etc/containerd/config.toml -p wa -k docker
      -w /etc/sysconfig/docker -p wa -k docker
      # --- Binaries (watch for write/execute) ---
      -w /usr/bin/containerd -k docker
      -w /usr/bin/dockerd -k docker
      -w /usr/bin/containerd-shim -p wa -k docker
      -w /usr/bin/containerd-shim-runc-v1 -p wa -k docker
      -w /usr/bin/containerd-shim-runc-v2 -p wa -k docker
      -w /usr/bin/runc -p wa -k docker
    marker: "# {mark} DOCKER AUDIT RULES"
    insertbefore: '-e 2'
  when: audit_rules.stat.exists
  notify: Restart auditd
  tags: 
    - docker_hardening
    - docker

# -------------------------------------------------------
# Docker daemon hardening - daemon.json configuration
# -------------------------------------------------------

- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: 
    - docker_hardening
    - docker

- name: Ensure /etc/docker/certs directory exists
  ansible.builtin.file:
    path: /etc/docker/certs
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags: 
    - docker_hardening
    - docker

- name: Write Docker daemon.json from template
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    validate: 'python3 -c "import json; json.load(open(\"%s\"))"'
  notify: Restart docker
  tags: 
    - docker_hardening
    - docker

# CIS 2.1 - Run Docker daemon as non-root (rootless mode)
- name: Configure rootless Docker
  when: DOCKER_rootless_enabled | bool
  tags: 
    - docker_hardening
    - docker
  block:
    - name: Ensure rootless Docker user exists
      ansible.builtin.user:
        name: "{{ DOCKER_rootless_user }}"
        shell: /bin/bash
        system: true
        create_home: true

    - name: Install rootless Docker dependencies
      ansible.builtin.package:
        name:
          - uidmap
          - dbus-user-session
        state: present

    - name: Check if rootless Docker is already installed
      ansible.builtin.stat:
        path: "/home/{{ DOCKER_rootless_user }}/.config/systemd/user/docker.service"
      register: rootless_docker_service
      become: true
      become_user: "{{ DOCKER_rootless_user }}"

    - name: Enable rootless Docker for user
      ansible.builtin.command:
        cmd: "dockerd-rootless-setuptool.sh install"
      become: true
      become_user: "{{ DOCKER_rootless_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ DOCKER_rootless_user }}"
      when: not rootless_docker_service.stat.exists
      changed_when: not rootless_docker_service.stat.exists

# CIS 2.13 - Restrict container from acquiring new privileges via sysctl
- name: Set kernel parameter to restrict privilege escalation
  ansible.posix.sysctl:
    name: kernel.unprivileged_userns_clone
    value: '1'
    state: present
    reload: true
  ignore_errors: true
  tags: 
    - docker_hardening
    - docker

- name: Verify Docker daemon.json is valid
  ansible.builtin.command:
    cmd: docker info
  register: docker_info
  changed_when: false
  failed_when: docker_info.rc != 0
  tags: 
    - docker_hardening
    - docker

# -------------------------------------------------------
# Req 7 - Container Daemon configuration file hardening
# -------------------------------------------------------

# --- docker.service file ---
- name: Find docker.service file path
  ansible.builtin.command:
    cmd: systemctl show -p FragmentPath docker.service
  register: docker_service_path
  changed_when: false
  tags: 
    - docker_hardening
    - docker

- name: Set docker.service path fact
  ansible.builtin.set_fact:
    docker_service_file: "{{ docker_service_path.stdout | regex_replace('FragmentPath=', '') }}"
  tags: 
    - docker_hardening
    - docker

- name: Ensure docker.service file ownership is root:root
  ansible.builtin.file:
    path: "{{ docker_service_file }}"
    owner: root
    group: root
  when: docker_service_file != ''
  tags: 
    - docker_hardening
    - docker

- name: Ensure docker.service file permissions are 644
  ansible.builtin.file:
    path: "{{ docker_service_file }}"
    mode: '0644'
  when: docker_service_file != ''
  tags: 
    - docker_hardening
    - docker

