    - docker

# --- /etc/docker directory ---
- name: Ensure /etc/docker directory ownership is root:root
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: 
    - docker_hardening
    - docker

# --- Registry certificate files ---
- name: Find registry certificate files
  ansible.builtin.find:
    paths: /etc/docker/certs.d
    patterns: "*.crt,*.cert"
    recurse: true
  register: registry_certs
  tags: 
    - docker_hardening
    - docker

- name: Ensure registry certificate file ownership is root:root
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
  loop: "{{ registry_certs.files }}"
  tags: 
    - docker_hardening
    - docker

- name: Ensure registry certificate file permissions are 444
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: '0444'
  loop: "{{ registry_certs.files }}"
  tags: 
    - docker_hardening
    - docker

